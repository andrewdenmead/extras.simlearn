<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Going for a Drive</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: an agree/disagree road trip on the student's phone. Each statement is a blue motorway sign: disagree, turn left; agree, turn right. Four turns end in one of sixteen cities, and the city tells the class how you answered. ?teacher shows the whole map, what each city means, and a tally. */
:root{
  --bg:#eef1ee; --paper:#ffffff; --ink:#1b1f24; --muted:#636b73; --line:#d4d9d5;
  --sign:#1f5aa6; --sign-ink:#ffffff; --road:#c3cac5; --route:#f2b632; --green:#2b7a4b; --accent:#1f5aa6; --dis:#3b4148;
  --sans:"Rethink Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111518; --paper:#1a1f23; --ink:#ecf0f2; --muted:#a0a9b0; --line:#2f363c;
  --sign:#2c6cc4; --road:#3a4248; --route:#f4c04a; --green:#4caf78; --accent:#6aa3f0; --dis:#c9d0d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518; --paper:#1a1f23; --ink:#ecf0f2; --muted:#a0a9b0; --line:#2f363c;
  --sign:#2c6cc4; --road:#3a4248; --route:#f4c04a; --green:#4caf78; --accent:#6aa3f0; --dis:#c9d0d6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:clamp(16px,.8vw + 11px,20px);line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:grid;gap:18px}
.label{font-family:var(--mono);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:clamp(24px,3.2vw,42px);line-height:1.12;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
p{margin:0;max-width:62ch}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.8em;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:14px}

/* the sign */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:18px 18px 16px;display:grid;gap:16px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--sign),0 14px 30px rgba(20,40,80,.18)}
.sign .n{font-family:var(--mono);font-size:.7em;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sign .q{font-weight:700;font-size:clamp(21px,1.6vw + 12px,32px);line-height:1.25;text-wrap:balance}
.turns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.turn{display:grid;justify-items:center;gap:2px;border-radius:11px;padding:14px 8px;cursor:pointer;font-weight:700;border:2px solid #fff;transition:transform .1s,filter .15s}
.turn:active{transform:scale(.97)}
.turn .a{font-size:1.6em;line-height:1}
.turn .s{font-weight:600;font-size:.78em;opacity:.9}
.turn.l{background:transparent;color:#fff}
.turn.r{background:#fff;color:var(--sign)}
.turn:hover{filter:brightness(1.06)}

/* map */
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:6px}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox .note{font-size:.75em;color:var(--muted);text-align:right}
svg .road{stroke:var(--road);stroke-width:4;fill:none;stroke-linecap:round}
svg .driven{stroke:var(--route);stroke-width:6;fill:none;stroke-linecap:round}
svg .node{fill:var(--paper);stroke:var(--road);stroke-width:2}
svg .node.on{fill:var(--route);stroke:var(--route)}
svg .dot{fill:var(--paper);stroke:var(--muted);stroke-width:2}
svg .dot.on{fill:var(--route);stroke:var(--ink);stroke-width:2.5}
svg .city{fill:var(--muted);font-family:var(--sans);font-size:13px;font-weight:600}
svg .city.on{fill:var(--ink);font-size:16px;font-weight:700}
svg .start{fill:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.08em}
svg .lr{fill:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
svg .cnt{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:500}

/* arrival */
.arrive{background:var(--green);color:#fff;border-radius:14px;padding:18px 20px;display:grid;gap:6px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--green)}
.arrive .city{font-size:clamp(36px,6vw,64px);font-weight:700;line-height:1}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.panel h3{margin:0;font-size:1em}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recap li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg);border-radius:10px;padding:9px 12px;font-size:.92em}
.tag{font-family:var(--mono);font-size:.72em;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px;white-space:nowrap}
.tag.y{background:var(--sign);color:#fff}
.tag.n{border:1.5px solid var(--dis);color:var(--dis)}

/* teacher */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
.stmts{margin:0;padding-left:1.4em;display:grid;gap:4px}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.ccard.top{border:2px solid var(--route)}
.ccard .ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .cn{font-weight:700}
.pattern{display:flex;gap:4px;flex-wrap:wrap}
.count{display:flex;align-items:center;gap:6px}
.count b{font-family:var(--mono);font-weight:500;font-size:1.2em;min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.count button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
(() => {
/* ---------- the trip: change these for another topic (four statements a round) ---------- */
const D_TOPIC = "Market research";
const D_ROUNDS = [
  ["Customers usually know what they want.",
   "A survey of 2,000 people is more useful than a long conversation with ten.",
   "Asking your friends what they think of your idea is a waste of time.",
   "If people say they would buy a product, they probably will."],
  ["Companies should test new products in one city before they launch everywhere.",
   "Online reviews tell you more than any focus group.",
   "A good manager trusts their gut feeling more than the data.",
   "AI will soon make market researchers unnecessary."],
];
const D_CITIES = ["Lisbon","Oslo","Montreal","Seoul","Edinburgh","Nairobi","Lima","Osaka",
                "Vienna","Havana","Dubai","Melbourne","Prague","Reykjavik","Marrakesh","Vancouver"];
/* ---------------------------------------------------------------------------------------- */
const DEFAULT = {topic:D_TOPIC, rounds:D_ROUNDS, cities:D_CITIES};
/* ---------- sets: ?set=<slug> loads sets/<slug>.json from this site; without it, the example above ---------- */
const SLUG = (new URLSearchParams(location.search).get("set") || "").toLowerCase();
function loadSet(def, go){
  if (!SLUG) return go(def, "");
  if (!/^[a-z0-9-]{1,80}$/.test(SLUG)) return go(def, "missing");
  fetch("sets/" + SLUG + ".json", {cache:"no-cache"})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => go(Object.assign({}, def, j), ""))
    .catch(() => go(def, "missing"));
}
function setNotice(err){
  if (err !== "missing") return;
  const d = document.createElement("div");
  d.setAttribute("role", "status");
  d.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1b1f24;color:#fff;padding:10px 16px;border-radius:10px;font:14px system-ui,sans-serif;z-index:99;max-width:calc(100% - 32px)";
  d.textContent = "We couldn't find that set, so this is the example version.";
  document.body.appendChild(d); setTimeout(() => d.remove(), 6000);
}
loadSet(DEFAULT, (SET, setErr) => {
const TOPIC = SET.topic, ROUNDS = SET.rounds, CITIES = SET.cities;

const TEACHER = new URLSearchParams(location.search).has("teacher");
const KEY = "going-for-a-drive-v2" + (SLUG ? "-" + SLUG : "") + (TEACHER ? "-teacher" : "");
const fresh = () => TEACHER ? {round:0, tally:[{}, {}]} : {screen:"start", round:0, paths:[[], []]};
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const leaf = path => path.reduce((a, b) => a * 2 + b, 0);           // left = 0 (disagree), right = 1 (agree)
const pathOf = i => [3, 2, 1, 0].map(k => (i >> k) & 1);

/* ---------- the map: start at the bottom, sixteen cities at the top ---------- */
function mapSVG(path, opts = {}){
  const W = opts.wide ? 1000 : 520, H = opts.wide ? 330 : 300;
  const ys = opts.wide ? [300, 240, 180, 120, 70] : [272, 214, 156, 98, 50];
  const x = (d, i) => W * (i + .5) / Math.pow(2, d);
  const curve = (x1, y1, x2, y2) => `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
  let roads = "", driven = "", nodes = "";
  for (let d = 0; d < 4; d++) for (let p = 0; p < Math.pow(2, d); p++) for (const c of [0, 1])
    roads += `<path class="road" d="${curve(x(d, p), ys[d], x(d + 1, 2 * p + c), ys[d + 1])}"/>`;
  let idx = 0, cx = x(0, 0), cy = ys[0];
  path.forEach((bit, k) => { idx = idx * 2 + bit; const nx = x(k + 1, idx), ny = ys[k + 1]; driven += `<path class="driven" d="${curve(cx, cy, nx, ny)}"/>`; cx = nx; cy = ny; if (k < 3) nodes += `<circle class="node on" cx="${nx}" cy="${ny}" r="5"/>`; });
  const done = path.length === 4, mine = done ? leaf(path) : -1;
  let leaves = "";
  for (let i = 0; i < 16; i++) {
    const lx = x(4, i), on = i === mine;
    leaves += `<circle class="dot${on ? " on" : ""}" cx="${lx}" cy="${ys[4]}" r="${on ? 8 : 5}"/>`;
    if (opts.wide) {
      leaves += `<text class="city" x="${lx}" y="${ys[4] - 14 - (i % 2 ? 18 : 0)}" text-anchor="middle">${esc(CITIES[i])}</text>`;
      if (opts.counts && opts.counts[i]) leaves += `<text class="cnt" x="${lx}" y="${ys[4] + 24}" text-anchor="middle">${opts.counts[i]}</text>`;
    } else if (on) {
      const anchor = lx < 70 ? "start" : lx > W - 70 ? "end" : "middle";
      leaves += `<text class="city on" x="${anchor === "start" ? 4 : anchor === "end" ? W - 4 : lx}" y="${ys[4] - 16}" text-anchor="${anchor}">${esc(CITIES[i])}</text>`;
    }
  }
  const car = !done && !opts.wide ? `<g transform="translate(${cx - 11},${cy - 26})"><rect fill="var(--ink)" x="0" y="6" width="22" height="10" rx="3"/><rect fill="var(--ink)" x="4" y="1" width="14" height="8" rx="3"/><circle cx="6" cy="17" r="3" fill="var(--route)"/><circle cx="16" cy="17" r="3" fill="var(--route)"/></g>` : "";
  return `<svg viewBox="0 0 ${W} ${H + 24}" role="img" aria-label="Road map with sixteen destinations${done ? "; you are in " + CITIES[mine] : ""}">
    ${roads}${driven}${nodes}
    <circle class="node on" cx="${x(0, 0)}" cy="${ys[0]}" r="7"/>
    <text class="start" x="${x(0, 0)}" y="${ys[0] + 24}" text-anchor="middle">START</text>
    <text class="lr" x="${x(0, 0) - 70}" y="${ys[0] + 4}" text-anchor="end">← DISAGREE</text>
    <text class="lr" x="${x(0, 0) + 70}" y="${ys[0] + 4}">AGREE →</text>
    ${leaves}${car}
  </svg>`;
}

function head(sub){ return `<header class="head"><h1>Going for a Drive</h1><span class="label">${esc(sub)}</span></header>`; }
const mapBox = (path, opts) => `<div class="mapbox">${mapSVG(path, opts)}<span class="note">Not to scale. Not even slightly.</span></div>`;

function start(){
  return head(TOPIC) + `<div class="layout"><div class="col">
      <h2>Agree? Turn right. Disagree? Turn left.</h2>
      <p>You'll get ${ROUNDS.length} rounds of four statements about ${esc(TOPIC.toLowerCase())}. Decide fast. After four turns you'll arrive in a city. <strong>Remember it:</strong> your teacher will ask who ended up where.</p>
      <div><button class="btn" type="button" id="go">Start the engine</button></div></div>
    ${mapBox([], {})}</div>`;
}
function question(){
  const r = S.round, path = S.paths[r], q = path.length;
  return head(`Round ${r + 1} · turn ${q + 1} of 4`) + `<div class="layout"><div class="col">
      <div class="sign"><span class="n">Statement ${q + 1} of 4</span><span class="q">${esc(ROUNDS[r][q])}</span>
        <div class="turns"><button class="turn l" type="button" data-turn="0"><span class="a" aria-hidden="true">↰</span>Turn left<span class="s">I disagree</span></button>
        <button class="turn r" type="button" data-turn="1"><span class="a" aria-hidden="true">↱</span>Turn right<span class="s">I agree</span></button></div></div>
      ${q ? `<div><button class="btn ghost small" type="button" id="back">← Change my last answer</button></div>` : ""}
    </div>${mapBox(path, {})}</div>`;
}
function recap(r){
  return `<ul class="recap">${ROUNDS[r].map((s, i) => `<li><span>${esc(s)}</span>${S.paths[r][i] ? '<span class="tag y">Agreed</span>' : '<span class="tag n">Disagreed</span>'}</li>`).join("")}</ul>`;
}
function arrived(){
  const r = S.round, last = r === ROUNDS.length - 1;
  return head(`Round ${r + 1} · arrived`) + `<div class="layout"><div class="col">
      <div class="arrive"><span class="label" style="color:inherit;opacity:.85">You ended up in</span><span class="city">${esc(CITIES[leaf(S.paths[r])])}</span><span>Tell your teacher when they ask. Who else is here?</span></div>
      <div class="panel"><h3>How you got here</h3>${recap(r)}</div>
      <div><button class="btn" type="button" id="next">${last ? "See both trips" : "Start round " + (r + 2)}</button></div>
    </div>${mapBox(S.paths[r], {})}</div>`;
}
function final(){
  return head("Journey complete") + `<h2>${ROUNDS.map((_, r) => esc(CITIES[leaf(S.paths[r])])).join(" → ")}</h2>
    <p>Find a classmate who ended up somewhere else. Where did your routes split? Talk through one statement where you turned different ways.</p>
    ${ROUNDS.map((_, r) => `<div class="panel"><h3>Round ${r + 1}: ${esc(CITIES[leaf(S.paths[r])])}</h3>${recap(r)}</div>`).join("")}
    <div><button class="btn ghost small" type="button" id="again">Drive again</button></div>`;
}
function teacher(){
  const r = S.round, t = S.tally[r], max = Math.max(0, ...Object.values(t));
  return head("Teacher · " + TOPIC) + `<h2>Who ended up where?</h2>
    <div class="tabs" role="group" aria-label="Round">${ROUNDS.map((_, i) => `<button type="button" data-round="${i}" aria-pressed="${i === r}">Round ${i + 1}</button>`).join("")}</div>
    <ol class="stmts">${ROUNDS[r].map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    ${mapBox([], {wide:true, counts:t})}
    <p class="label">Ask for hands city by city and tap them in. Each city shows how its drivers answered: A = agreed, D = disagreed, statements 1 to 4.</p>
    <div class="cities">${CITIES.map((c, i) => `<div class="ccard${t[i] && t[i] === max ? " top" : ""}"><div class="ch"><span class="cn">${esc(c)}</span>
        <span class="count"><button type="button" data-dn="${i}" aria-label="One fewer in ${esc(c)}">−</button><b>${t[i] || 0}</b><button type="button" data-up="${i}" aria-label="One more in ${esc(c)}">+</button></span></div>
        <div class="pattern">${pathOf(i).map((b, k) => `<span class="tag ${b ? "y" : "n"}" title="Statement ${k + 1}">${k + 1} ${b ? "A" : "D"}</span>`).join("")}</div></div>`).join("")}</div>
    <div class="row"><span id="clr"><button class="btn ghost small" type="button" id="clear">Clear the tally for the next class</button></span></div>`;
}
function render(){
  $("#app").innerHTML = TEACHER ? teacher() : ({start, question, arrived, final})[S.screen]();
}
const top = () => window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "go") { S = fresh(); S.screen = "question"; save(); render(); }
  if (b.dataset.turn) { const p = S.paths[S.round]; p.push(+b.dataset.turn); if (p.length === 4) S.screen = "arrived"; save(); render(); }
  if (b.id === "back") { S.paths[S.round].pop(); save(); render(); }
  if (b.id === "next") { if (S.round < ROUNDS.length - 1) { S.round++; S.screen = "question"; } else S.screen = "final"; save(); render(); top(); }
  if (b.id === "again") { S = fresh(); save(); render(); top(); }
  if (b.dataset.round) { S.round = +b.dataset.round; save(); render(); }
  if (b.dataset.up) { const t = S.tally[S.round]; t[b.dataset.up] = (t[b.dataset.up] || 0) + 1; save(); render(); }
  if (b.dataset.dn) { const t = S.tally[S.round]; t[b.dataset.dn] = Math.max(0, (t[b.dataset.dn] || 0) - 1); save(); render(); }
  if (b.id === "clear") $("#clr").innerHTML = `Clear both rounds? <button class="btn small" type="button" id="clearYes">Yes, clear</button> <button class="btn ghost small" type="button" id="clearNo">Keep</button>`;
  if (b.id === "clearNo") render();
  if (b.id === "clearYes") { S = fresh(); save(); render(); }
});
render(); setNotice(setErr);
});
})();
</script>
</body>
</html>
