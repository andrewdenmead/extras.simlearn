<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SimLearn Extras</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#EDF0F2;--surface:#FFFFFF;--ink:#16202A;--muted:#56626E;--line:#D3DAE0;--accent:#1C5D7C}
@media (prefers-color-scheme:dark){:root{--bg:#10161C;--surface:#18212A;--ink:#E3E9EF;--muted:#98A4B0;--line:#2B3642;--accent:#72B5D8;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;padding:40px 16px}
.wrap{max-width:760px;margin:0 auto}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Literata,Georgia,serif;font-weight:600;font-size:34px;margin:6px 0 8px}
p{color:var(--muted);max-width:60ch}
a.tool{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px;color:inherit;text-decoration:none}
a.tool:hover{border-color:var(--accent)}
a.tool .c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--accent)}
a.tool h2{font-family:Literata,Georgia,serif;font-weight:600;font-size:20px;margin:4px 0}
a.tool span.d{color:var(--muted);font-size:14.5px}
</style>
</head>
<body><div class="wrap">
<div class="eyebrow">SimLearn</div>
<h1>Extras</h1>
<p>Stand-alone classroom tools that sit alongside the simulations. No login, no cookies, no tracking.</p>
<a class="tool" href="tariff-debate/"><span class="c">AE · Week 2 warm-up</span><h2>Reading the Tariff Debate</h2><span class="d">Tag positions, reasoning, evidence and counter-arguments in four sources, judge how strong they are, then build a cited paragraph.</span></a>
</div></body>
</html>
