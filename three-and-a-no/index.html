<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three and a No</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: a questionnaire on the student's phone: twelve tick-box options; three ticks (ranked by the order you tap) and one cross. Then a summary card to compare with a partner, and a teacher tally (?teacher) for the projector. */
:root{
  --bg:#f3f3ef; --paper:#ffffff; --ink:#1c1d21; --muted:#686a72; --line:#d9d9d2;
  --yes:#1e8457; --no:#c23b3b; --hi:#f4dc5c; --accent:#1c1d21; --on:#ffffff;
  --sans:"Rethink Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518; --paper:#1d1f23; --ink:#eeeef0; --muted:#a3a5ad; --line:#33363c;
  --yes:#43b47f; --no:#e2605d; --hi:#7a6a1a; --accent:#eeeef0; --on:#141518; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --paper:#1d1f23; --ink:#eeeef0; --muted:#a3a5ad; --line:#33363c;
  --yes:#43b47f; --no:#e2605d; --hi:#7a6a1a; --accent:#eeeef0; --on:#141518; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:clamp(16px,.8vw + 11px,20px);line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:grid;gap:18px}
.label{font-family:var(--mono);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:700;letter-spacing:-.01em}
.head h1 .t{color:var(--yes)}.head h1 .x{color:var(--no)}
h2{margin:0;font-size:clamp(24px,3.2vw,42px);line-height:1.12;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h2 mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 .08em}
p{margin:0;max-width:62ch}
.brief{display:grid;gap:10px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.82em}
.step b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-family:var(--mono);font-size:.85em;font-weight:500}
.step.on{border-color:var(--ink)}
.step.on b{background:var(--ink);color:var(--paper)}
.step.done b{background:var(--yes);color:#fff}

/* the options */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
.opt:active{transform:scale(.99)}
.box{width:30px;height:30px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:.95em;margin-top:2px}
.opt .ot{font-weight:600;line-height:1.3}
.opt .od{display:block;font-size:.8em;color:var(--muted);line-height:1.35;margin-top:2px}
.opt.keep{border-color:var(--yes)}
.opt.keep .box{background:var(--yes);border-color:var(--yes);color:#fff}
.opt.ban{border-color:var(--no)}
.opt.ban .box{background:var(--no);border-color:var(--no);color:#fff}
.opt.dim{opacity:.55}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(28,29,33,.1)}
.dock .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tally{display:flex;gap:6px;align-items:center}
.tally i{width:28px;height:28px;border-radius:6px;border:2px dashed var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:.85em}
.tally i.k{border:0;background:var(--yes);color:#fff}
.tally i.n{border:0;background:var(--no);color:#fff}
.tally .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on);line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.8em;border-radius:9px}
.btn:disabled{opacity:.35;cursor:default}
.dock .msg{font-size:.85em;color:var(--muted)}

/* summary */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;gap:14px;box-shadow:0 10px 28px rgba(28,29,33,.07)}
.mine{display:grid;gap:8px}
.mine li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;font-weight:600;font-size:1.08em}
.mine ol,.mine ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.mine .box{margin:0}
.ban-line .box{background:var(--no);border-color:var(--no);color:#fff}
.keep-line .box{background:var(--yes);border-color:var(--yes);color:#fff}
.phrases{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.phrase{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92em}
.phrase b{display:block;font-family:var(--mono);font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* teacher tally */
.board{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px}
@media (max-width:700px){.trow{grid-template-columns:minmax(0,1fr) auto}.trow .bars{grid-column:1/-1;grid-row:2}}
.trow .nm{font-weight:600;line-height:1.25}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 2.2em;gap:8px;align-items:center}
.bar .track{height:14px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .3s}
.bar.k .fill{background:var(--yes)}
.bar.n .fill{background:var(--no)}
.bar b{font-family:var(--mono);font-weight:500;font-size:.85em;font-variant-numeric:tabular-nums;text-align:right}
.tbtns{display:grid;grid-template-columns:repeat(2,auto);gap:6px}
.tbtns button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:.82em;white-space:nowrap}
.tbtns .k{color:var(--yes)}.tbtns .n{color:var(--no)}
.trow.top{border:2px solid var(--yes)}
.trow.worst{border:2px solid var(--no)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85em;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .lk::before{background:var(--yes)}.legend .ln::before{background:var(--no)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

<script>
(() => {
/* ---------- the content: change these for another topic ---------- */
const TOPIC = "Market research";
const SCENE = "Your company is about to launch a new snack. The budget pays for <mark>three kinds of research</mark>, no more.";
const ASK_KEEP = "Tick the three you would pay for, best first.";
const ASK_BAN = "Now cross the one you would never trust.";
const KEEP_N = 3;
const ITEMS = [
  {t:"An online survey of 2,000 people", d:"A representative sample: the right mix of ages, incomes and shopping habits."},
  {t:"Asking friends and family", d:"Fast, free and very honest. Or is it?"},
  {t:"A blind taste test", d:"People try it with the brand and the packaging hidden."},
  {t:"A focus group", d:"Eight people, a moderator, two hours and a lot of free snacks."},
  {t:"TikTok comments", d:"What people say under your teaser video."},
  {t:"Selling it in one city first", d:"A test market: real shops, real money, before the national launch."},
  {t:"Google search trends", d:"How often people searched for “high-protein snack” over five years."},
  {t:"Your rival's sales figures", d:"If you can find them."},
  {t:"Online reviews of similar products", d:"Thousands of star ratings and comments."},
  {t:"Watching shoppers in the aisle", d:"What they pick up, read, put back and buy."},
  {t:"Asking an AI chatbot", d:"“Would people buy a high-protein snack bar?”"},
  {t:"The CEO's gut feeling", d:"Twenty years in the business. Never wrong. Apparently."},
];
const PHRASES = [
  ["Make your case","I'd definitely go for … because …"],
  ["Ask why","What makes you trust that one?"],
  ["Disagree politely","I see your point, but …"],
  ["Weigh it up","It's quick and cheap, but it won't tell us …"],
  ["Compromise","Could we keep … and swap … for …?"],
  ["Agree","OK, let's go with that."],
];
/* ------------------------------------------------------------------ */

const TEACHER = new URLSearchParams(location.search).has("teacher");
const KEY = "three-and-a-no-v1" + (TEACHER ? "-teacher" : "");
const fresh = () => TEACHER ? {k: ITEMS.map(() => 0), n: ITEMS.map(() => 0)} : {keep:[], ban:null, done:false};
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function head(sub){ return `<header class="head"><h1>Three <span class="t">✓</span> and a No <span class="x">✗</span></h1><span class="label">${esc(sub)}</span></header>`; }
function stage(){ return S.done ? 3 : S.keep.length < KEEP_N ? 1 : 2; }
function steps(){
  const st = stage(), names = [`Tick ${KEEP_N}`, "Cross 1", "Agree with a partner"];
  return `<div class="steps">${names.map((n, i) => `<span class="step${i+1 === st ? " on" : i+1 < st ? " done" : ""}"><b>${i+1 < st ? "✓" : i+1}</b>${n}</span>`).join("")}</div>`;
}

function pick(){
  const st = stage();
  return head(TOPIC) + `<section class="brief"><h2>${SCENE}</h2><p><strong>${st === 1 ? ASK_KEEP : ASK_BAN}</strong> Tap again to undo.</p>${steps()}</section>
    <div class="grid">${ITEMS.map((it, i) => {
      const k = S.keep.indexOf(i), isBan = S.ban === i;
      const cls = k >= 0 ? " keep" : isBan ? " ban" : (st === 2 && k < 0 ? "" : "");
      return `<button type="button" class="opt${cls}" data-i="${i}" aria-pressed="${k >= 0 || isBan}"><span class="box">${k >= 0 ? k + 1 : isBan ? "✗" : ""}</span><span><span class="ot">${esc(it.t)}</span><span class="od">${esc(it.d)}</span></span></button>`;
    }).join("")}</div>`;
}
function dock(){
  if (TEACHER || S.done) { $("#dock").hidden = true; return; }
  const st = stage();
  $("#dock").hidden = false;
  const slots = [...Array(KEEP_N)].map((_, j) => S.keep[j] !== undefined ? `<i class="k">${j+1}</i>` : `<i>${j+1}</i>`).join("") + `<span class="sep"></span>` + (S.ban !== null ? `<i class="n">✗</i>` : `<i>✗</i>`);
  const ready = S.keep.length === KEEP_N && S.ban !== null;
  $("#dockIn").innerHTML = `<div class="tally" aria-label="Your picks">${slots}</div>
    <span class="msg">${st === 1 ? `${KEEP_N - S.keep.length} to tick` : S.ban === null ? "Now cross one" : "Done? Compare with a partner."}</span>
    <button class="btn" type="button" id="done"${ready ? "" : " disabled"}>Show my picks</button>`;
}
function summary(){
  return head(TOPIC) + `<section class="brief"><h2>Now <mark>agree with a partner</mark>.</h2><p>Show each other your picks. Then agree on <strong>one</strong> list of three and <strong>one</strong> cross between you. Be ready to tell the class what you chose and why.</p>${steps()}</section>
  <div class="card mine">
    <span class="label">My research plan</span>
    <ol>${S.keep.map((i, j) => `<li class="keep-line"><span class="box">${j+1}</span>${esc(ITEMS[i].t)}</li>`).join("")}</ol>
    <ul><li class="ban-line"><span class="box">✗</span>${esc(ITEMS[S.ban].t)}</li></ul>
  </div>
  <div class="card"><span class="label">Useful phrases</span><div class="phrases">${PHRASES.map(([a, b]) => `<div class="phrase"><b>${esc(a)}</b>${esc(b)}</div>`).join("")}</div></div>
  <div><button class="btn ghost small" type="button" id="redo">Change my picks</button></div>`;
}
function teacher(){
  const maxK = Math.max(1, ...S.k), maxN = Math.max(1, ...S.n);
  const topK = Math.max(...S.k), topN = Math.max(...S.n);
  const order = ITEMS.map((_, i) => i);
  return head("Class tally · " + TOPIC) + `<section class="brief"><h2>What did the class choose?</h2>
    <p>As each pair tells you their three and their cross, tap <strong>+✓</strong> for each tick and <strong>+✗</strong> for the cross. Tap a bar to take one off.</p>
    <div class="legend"><span class="lk">Would pay for it</span><span class="ln">Would never trust it</span></div></section>
  <div class="board">${order.map(i => `<div class="trow${S.k[i] && S.k[i] === topK ? " top" : ""}${S.n[i] && S.n[i] === topN ? " worst" : ""}">
      <span class="nm">${esc(ITEMS[i].t)}</span>
      <div class="bars">
        <div class="bar k" data-minus="k${i}" title="Tap to take one off"><div class="track"><div class="fill" style="width:${S.k[i] / maxK * 100}%"></div></div><b>${S.k[i]}</b></div>
        <div class="bar n" data-minus="n${i}" title="Tap to take one off"><div class="track"><div class="fill" style="width:${S.n[i] / maxN * 100}%"></div></div><b>${S.n[i]}</b></div>
      </div>
      <div class="tbtns"><button type="button" class="k" data-plus="k${i}" aria-label="One more tick for ${esc(ITEMS[i].t)}">+✓</button><button type="button" class="n" data-plus="n${i}" aria-label="One more cross for ${esc(ITEMS[i].t)}">+✗</button></div>
    </div>`).join("")}</div>
  <div class="row"><span id="clr"><button class="btn ghost small" type="button" id="clear">Clear the tally for the next class</button></span></div>`;
}
function render(){
  $("#app").innerHTML = TEACHER ? teacher() : S.done ? summary() : pick();
  dock();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, .bar"); if (!b) return;
  if (b.dataset.i !== undefined && !TEACHER) {
    const i = +b.dataset.i, k = S.keep.indexOf(i);
    if (k >= 0) S.keep.splice(k, 1);
    else if (S.ban === i) S.ban = null;
    else if (S.keep.length < KEEP_N) S.keep.push(i);
    else S.ban = i;
    save(); render();
  }
  if (b.id === "done") { S.done = true; save(); render(); window.scrollTo({top:0}); }
  if (b.id === "redo") { S.done = false; save(); render(); }
  if (b.dataset.plus) { const f = b.dataset.plus[0], i = +b.dataset.plus.slice(1); S[f][i]++; save(); render(); }
  if (b.dataset.minus) { const f = b.dataset.minus[0], i = +b.dataset.minus.slice(1); S[f][i] = Math.max(0, S[f][i] - 1); save(); render(); }
  if (b.id === "clear") { $("#clr").innerHTML = `Clear everything? <button class="btn small" type="button" id="clearYes">Yes, clear</button> <button class="btn ghost small" type="button" id="clearNo">Keep</button>`; }
  if (b.id === "clearNo") render();
  if (b.id === "clearYes") { S = fresh(); save(); render(); }
});
render();
})();
</script>
</body>
</html>
