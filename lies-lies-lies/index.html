<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lies, Lies, Lies</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --ink:#1d1b26; --muted:#615d70; --line:#e2dfea; --bg:#f5f3f9; --card:#fff;
  --true:#1f8a4c; --true-l:#e3f5ea; --lie:#c0392b; --lie-l:#fbe9e7; --acc:#5b3cc4; --acc-d:#43299a; --acc-l:#ece7fb;
  --a:#ffcf4a; --b:#59c3ff;
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,.display{font-family:"Rethink Sans","Instrument Sans",system-ui,sans-serif}

header.top{background:radial-gradient(circle at 15% 0%,#7c5cf0,transparent 55%),linear-gradient(135deg,var(--acc),#2a1863);color:#fff;padding:24px 16px 18px}
header.top .in{max-width:880px;margin:0 auto}
.kicker{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
header.top h1{margin:.05em 0 .15em;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.05;font-weight:700}
header.top h1 span{display:inline-block;transform:rotate(-3deg);background:var(--lie);padding:0 .25em;border-radius:6px;margin-left:.1em}
header.top p{margin:0;max-width:660px;opacity:.93}

.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 13px;font-size:.88rem}
.tabs button.on{background:var(--acc);color:#fff}
.who{margin-left:auto;font-size:.82rem;color:var(--muted)}

.wrap{max-width:880px;margin:0 auto;padding:18px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:1.2rem}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:.93rem}
.how ol{margin:0;padding-left:1.25em} .how li{margin:4px 0}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:999px;padding:7px 16px;font-size:.92rem;font-weight:600}
.btn.ghost{background:#fff;color:var(--acc-d)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fcfbfe}
textarea{min-height:56px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
.small{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* the slip */
.slip{position:relative;background:#fffdf3;border:1px dashed #cbbf8f;border-radius:6px;padding:16px 18px;margin:6px 0 14px;box-shadow:0 2px 8px rgba(60,40,0,.08)}
.slip .lab{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#8a7a3c;font-weight:700}
.slip h3{margin:.15em 0 .3em;font-size:1.3rem;font-family:"Rethink Sans",system-ui,sans-serif}
.slip p{margin:0}
.slip .secret{position:absolute;top:10px;right:12px;font-size:.72rem;font-weight:700;color:var(--true);background:var(--true-l);border-radius:999px;padding:2px 9px}

/* fields */
.fields{display:grid;gap:12px}
.field label{display:block;font-weight:600;font-size:.95rem;margin-bottom:3px}
.field .hint{font-size:.8rem;color:var(--muted);margin:0 0 4px}
.tips{background:var(--acc-l);border-radius:12px;padding:12px 16px;margin:0 0 14px;font-size:.92rem}
.tips b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-d);margin-bottom:4px}
.tips ul{margin:0;padding-left:1.1em} .tips li{margin:2px 0}

/* present */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pc{position:relative;border-radius:18px;padding:18px 18px 64px;min-height:220px;background:#fff;border:3px solid var(--line);overflow:hidden}
.pc .badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;font-weight:800;font-size:1.4rem;font-family:"Rethink Sans",system-ui,sans-serif;margin-bottom:8px;color:#1d1b26}
.pc.A{border-color:var(--a)} .pc.A .badge{background:var(--a)}
.pc.B{border-color:var(--b)} .pc.B .badge{background:var(--b)}
.pc h3{margin:0 0 6px;font-size:clamp(1.2rem,2.6vw,1.7rem);font-family:"Rethink Sans",system-ui,sans-serif;line-height:1.15}
.pc ul{margin:0;padding-left:1.1em} .pc li{margin:3px 0}
.pc .stamp{position:absolute;right:12px;bottom:12px;transform:rotate(-10deg) scale(.4);opacity:0;transition:all .35s cubic-bezier(.2,1.6,.4,1);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:"Rethink Sans",system-ui,sans-serif;font-size:clamp(1.2rem,3vw,2rem);border:4px solid;border-radius:10px;padding:2px 12px;background:rgba(255,255,255,.88)}
.revealed .pc .stamp{opacity:1;transform:rotate(-10deg) scale(1)}
.pc .stamp.real{color:var(--true);border-color:var(--true)} .pc .stamp.fake{color:var(--lie);border-color:var(--lie)}
.big .pc{font-size:1.15rem;min-height:300px}
.holdbtn{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}
.full{position:fixed;inset:0;z-index:50;background:#1d1b26;padding:56px 16px 24px;overflow:auto;display:none}
.full.on{display:block}
.full .duo{max-width:1200px;margin:0 auto}
.full .close{position:fixed;top:12px;right:12px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:6px 14px}
.full .row{justify-content:center;margin-top:18px}
.full .q{color:#fff;text-align:center;font-size:clamp(1.1rem,2.5vw,1.6rem);margin:0 0 14px;font-family:"Rethink Sans",system-ui,sans-serif}

/* teacher */
.sb{width:100%;border-collapse:collapse;font-size:.95rem}
.sb th,.sb td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.sb th:first-child,.sb td:first-child{text-align:left}
.cnt{display:inline-flex;align-items:center;gap:4px}
.cnt button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700}
.cnt b{min-width:22px;display:inline-block}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;background:#fff;padding:4px 10px;font-weight:700}
.seg2 button.on.A{background:var(--a)} .seg2 button.on.B{background:var(--b)}
.fooled{font-weight:800;color:var(--lie)}
.leader{font-size:1.05rem}
.keylist li{margin:6px 0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{max-width:880px;margin:0 auto;padding:0 16px 30px;font-size:.8rem;color:var(--muted)}
@media (max-width:640px){ .duo{grid-template-columns:1fr} .sb{font-size:.85rem} .cnt button{width:26px;height:26px} }
@media (prefers-color-scheme:dark){
  :root{--ink:#ece9f5;--muted:#a7a2b8;--line:#332f42;--bg:#14121b;--card:#1d1a27;--acc-l:#2a2347;--true-l:#16301f;--lie-l:#3a1e1b}
  .bar{background:rgba(29,26,39,.96)} .tabs,.btn.ghost,.pc,.cnt button,.seg2 button{background:#1d1a27}
  input[type=text],input[type=number],textarea{background:#17151f}
  .slip{background:#2a2617;border-color:#6b5e2e} .slip .lab{color:#d9c37a}
  .pc .stamp{background:rgba(29,26,39,.9)}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="kicker">Head to head · Real or made up?</div>
  <h1 id="title">Lies, Lies, <span>Lies</span></h1>
  <p id="lead"></p>
</div></header>

<div class="bar"><div class="in">
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="who" id="who"></span>
</div></div>

<main class="wrap" id="v-real"></main>
<main class="wrap" id="v-teacher" hidden></main>

<div class="toast" id="toast"></div>
<footer>SimLearn Extras · Your notes stay in this browser. Nothing is sent anywhere.</footer>

<script>
/* ---------- the example set: weird sustainable materials (all real, checked) ---------- */
const DEFAULT = {
  name: "Lies, Lies, Lies",
  what: "material", whats: "materials",
  topic: "really weird sustainable materials",
  items: [
    {name:"Banana fibre (“banana silk”)", fact:"In parts of Japan and Nepal, the stems of banana plants, usually thrown away after the harvest, are spun into a glossy, silk-like textile used for clothing and furniture."},
    {name:"Pineapple leather (Piñatex)", fact:"A material made from the fibres of pineapple leaves that would otherwise be left to rot in the fields. Fashion brands use it for shoes, jackets and handbags."},
    {name:"Kombucha leather", fact:"The rubbery jelly culture used to brew kombucha (a “SCOBY”) can be dried into a flexible, leathery sheet. Designers have made bags, caps and lampshades from it."},
    {name:"Bricks grown with human urine", fact:"Researchers at the University of Cape Town grew “bio-bricks” from sand, bacteria and human urine. Unlike normal bricks, they set at room temperature instead of being fired in a kiln."},
    {name:"Fish-scale sequins", fact:"A textile designer in London developed sequins and leather-like sheets from fish scales thrown away by the fishing industry, to replace plastic in fashion and interiors."},
    {name:"Algae-foam shoe soles", fact:"Companies harvest algae from lakes choked by algae blooms, dry it and turn it into the foam used in flip-flops and trainer soles, cleaning the water at the same time."},
    {name:"Avocado-stone plastic", fact:"A Mexican company makes biodegradable cutlery and straws from the stones of avocados thrown away by factories that make guacamole and avocado oil."},
    {name:"Rose fibre", fact:"Fibre from the waste parts of rose plants is spun into a soft, shiny yarn sometimes sold as “vegan silk”, used for scarves and dresses."},
    {name:"Fabric dyed by bacteria", fact:"Some bacteria naturally produce bright colours. Designers grow them on fabric so that the bacteria do the dyeing, with far less water and no toxic dye chemicals."},
    {name:"Cactus leather", fact:"Leaves of the prickly pear cactus can be cut without killing the plant, which grows them back. They are turned into a tough vegan leather used for bags and car seats."}
  ],
  fakes: [
    {name:"Onion-skin insulation", fact:"A Dutch start-up presses dried onion skins from food factories into insulation boards for houses. The boards keep homes warm, and the smell keeps insects away."},
    {name:"Pigeon-feather jackets", fact:"A Berlin company collects pigeon feathers from city squares, washes them and uses them instead of goose down to fill winter jackets."},
    {name:"Moth-wing paint", fact:"A French paint maker grinds the wings of moths killed by street lights into a shimmering, chemical-free wall paint."},
    {name:"Penguin-guano bricks", fact:"Builders in southern Chile mix penguin droppings from protected colonies with clay to make bricks that set in the sun without a kiln."},
    {name:"Nail-clipping glitter", fact:"A Korean beauty brand collects nail clippings from salons and grinds them into a biodegradable glitter for make-up."},
    {name:"Parmesan-rind leather", fact:"An Italian designer softens the hard rinds left over from Parmesan cheese and presses them into a leather for watch straps and wallets."},
    {name:"Pine-cone roof tiles", fact:"An Austrian company presses fallen pine cones with tree resin into roof tiles that last for forty years and smell of the forest when it rains."},
    {name:"Pumpkin-seed glass", fact:"Scientists in Hungary melt ground pumpkin-seed shells into a pale green glass that is now used for olive-oil bottles."},
    {name:"Beard-hair carpet tiles", fact:"Swedish barbers sell beard trimmings to a company that felts them into hard-wearing carpet tiles for offices."},
    {name:"Melon-rind cycling helmets", fact:"A Spanish company dries and presses melon rinds into a light, tough foam that replaces polystyrene in cycling helmets."}
  ],
  fake: [
    ["name", "Its name", "Give it a real-sounding name, maybe with a brand name in brackets."],
    ["from", "What it's made from", "Something weird but possible: a waste product, a plant, an animal, a by-product."],
    ["who", "Who made it, and where", "A university, a company or a designer, and a real city or country."],
    ["how", "How it works", "One or two steps: how the raw stuff becomes the material."],
    ["used", "What it's used for", "Who uses it now: brands, products, industries."],
    ["detail", "One very convincing detail", "A number, a date, a price or a small problem it still has."]
  ],
  tips: ["Be specific: numbers, dates and real places make a lie believable.", "Give it a small problem (“it still smells a bit”): perfect things sound fake.", "Make both talks the same length and give them the same confidence.", "Don't laugh. Decide now who says which one."]
};
/* ---------- sets: ?set=<slug> loads sets/<slug>.json; without it, the example above ---------- */
const P = new URLSearchParams(location.search);
const SLUG = (P.get("set") || "").toLowerCase(), TEACHER = P.has("teacher");
function loadSet(def, go){
  if (!SLUG) return go(def, "");
  if (!/^[a-z0-9-]{1,80}$/.test(SLUG)) return go(def, "missing");
  fetch("sets/" + SLUG + ".json", {cache:"no-cache"}).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => go(Object.assign({}, def, j), "")).catch(() => go(def, "missing"));
}
loadSet(DEFAULT, (SET, setErr) => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Cap = w => w.charAt(0).toUpperCase() + w.slice(1);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }
if (setErr) toast("We couldn't find that set, so this is the example version.");
document.title = SET.name;
const words = SET.name.split(" "), last = words.pop();
$("#title").innerHTML = `${esc(words.join(" "))} <span>${esc(last)}</span>`;
$("#lead").textContent = `Head to head, one against one. The app gives you a ${SET.topic.replace(/s$/,"")} that is real and two that aren't. Pick a lie, tell your partner about both, and see if they can spot it. Then swap.`;
const N = SET.items.length, FAKES = SET.fakes || [];

const KEY = "extras-lies-" + (SLUG || "example") + (TEACHER ? "-t" : "");
const fresh = () => TEACHER ? {view:"key"} : {real:null, offer:null, seen:[], fake:null, own:{name:"", story:""}, extra:"", first:"real", phase:"prep", me:0, them:0, round:1};
let S; try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = fresh(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const pick = (n, from, not = []) => { const pool = from.filter(i => !not.includes(i)); const src = pool.length >= n ? pool : from;
  return src.slice().sort(() => Math.random() - .5).slice(0, n); };
function shuffleReal(){ const all = SET.items.map((_, i) => i); let seen = (S.seen || []).filter(i => i < N);
  if (seen.length >= N - 1) seen = []; const [r] = pick(1, all, [...seen, S.real]); S.real = r; S.seen = [...seen, r]; }
function newOffer(){ S.offer = pick(2, FAKES.map((_, i) => i), S.offer || []); if (typeof S.fake === "number") S.fake = null; }
function newRound(){ shuffleReal(); newOffer(); S.fake = null; S.own = {name:"", story:""}; S.extra = ""; S.first = Math.random() < .5 ? "real" : "fake"; S.phase = "prep"; }
if (!TEACHER){ if (S.real == null || S.real >= N || !S.offer) newRound(); save(); }

document.querySelector(".bar").hidden = true;

function lie(){
  if (typeof S.fake === "number") { const f = FAKES[S.fake]; return {h: f.name, p: f.fact}; }
  if (S.fake === "own" && S.own.name.trim()) return {h: S.own.name.trim(), p: S.own.story.trim()};
  return null;
}
function duo(){
  const it = SET.items[S.real], L = lie();
  const real = {h: it.name, p: it.fact, real: true}, fake = {h: L.h, p: [L.p, S.extra.trim()].filter(Boolean).join(" "), real: false};
  const two = S.first === "real" ? [real, fake] : [fake, real];
  return `<div class="duo ${S.phase !== "prep" && S.phase !== "tell" ? "revealed" : ""}" id="duoBox">${two.map((c, i) => { const X = "AB"[i];
    return `<div class="pc ${X}"><span class="badge">${X}</span><h3>${esc(c.h)}</h3>${c.p ? `<p style="margin:0">${esc(c.p)}</p>` : ""}
      <span class="stamp ${c.real ? "real" : "fake"}">${c.real ? "Real" : "Made up"}</span></div>`; }).join("")}</div>`;
}
function drawPlay(){
  const it = SET.items[S.real], L = lie(), ready = !!L;
  let h = `<section class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="display" style="font-size:1.3rem;font-weight:700">You ${S.me} <span style="color:var(--muted);font-weight:400">·</span> Partner ${S.them}</div>
      <div class="small">Round ${S.round} · <button class="btn ghost" id="resetScore" style="padding:2px 10px;font-size:.8rem">Reset</button></div></section>`;
  if (S.phase === "prep") h += `
    <section class="card"><h2>1 · Your real ${esc(SET.what)}</h2>
      <div class="slip"><span class="secret">REAL</span><div class="lab">Keep it secret</div><h3>${esc(it.name)}</h3><p>${esc(it.fact)}</p></div>
      <button class="btn ghost" id="shuf">🔀 Shuffle: give me another one</button></section>
    <section class="card"><h2>2 · Pick your lie</h2>
      <p class="sub">Neither of these exists. Choose the one you can sell best.</p>
      <div class="duo">${S.offer.map((i, k) => { const f = FAKES[i], on = S.fake === i;
        return `<div class="slip" style="margin:0;${on ? "outline:3px solid var(--acc);" : ""}"><span class="secret" style="color:var(--lie);background:var(--lie-l)">FAKE</span>
          <div class="lab">Lie ${k + 1}</div><h3>${esc(f.name)}</h3><p>${esc(f.fact)}</p>
          <div class="row" style="margin-top:10px"><button class="btn ${on ? "" : "ghost"}" data-use="${i}">${on ? "✓ My lie" : "Use this one"}</button></div></div>`; }).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="others">Show me two others</button>
        <button class="btn ${S.fake === "own" ? "" : "ghost"}" id="own">Write my own</button></div>
      ${S.fake === "own" ? `<div class="fields" style="margin-top:12px">
        <div class="field"><label for="ownName">Its name</label><input type="text" id="ownName" maxlength="60"></div>
        <div class="field"><label for="ownStory">What it is, who makes it, where</label><textarea id="ownStory"></textarea></div></div>` : ""}
      <details style="margin-top:12px"><summary class="small" style="cursor:pointer">Add a convincing detail (optional)</summary>
        <div class="tips" style="margin-top:8px"><b>How to lie well</b><ul>${SET.tips.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <textarea id="extra" placeholder="A number, a date, a price, or a small problem it still has"></textarea></details>
      <div class="row" style="margin-top:14px"><button class="btn" id="go" ${ready ? "" : "disabled"}>I'm ready: tell my partner →</button></div></section>`;
  else h += `
    <section class="card"><h2>${S.phase === "tell" ? "3 · Tell your partner about A and B" : S.phase === "swapped" ? "Round over" : "The answer"}</h2>
      <p class="sub">${S.phase === "tell" ? "Show them the two cards, or just tell them in your own words. Then they guess: A or B?" : S.phase === "revealed" ? "Did they spot your lie?" : S.phase === "swapped" ? "Ready for the next one?" : "Your turn is done."}</p>
      ${duo()}
      ${S.phase === "tell" ? `<div class="row" style="margin-top:14px"><button class="btn holdbtn" id="reveal"><i></i>They've guessed: hold to reveal</button>
        <button class="btn ghost" id="swap">Swap A and B</button><button class="btn ghost" id="back">← Change my lie</button></div>` : ""}
      ${S.phase === "revealed" ? `<div class="row" style="margin-top:14px"><button class="btn" id="fooled">😈 I fooled them</button>
        <button class="btn ghost" id="spotted">🕵️ They spotted it</button></div>` : ""}
      ${S.phase === "scored" ? `<div class="tips" style="margin-top:14px"><b>Now swap</b>Your partner tells you about their A and B. Guess which one is real, then they reveal on their phone. How did you do?</div>
        <div class="row"><button class="btn" id="iSpot">🕵️ I spotted their lie</button><button class="btn ghost" id="iFooled">😵 They fooled me</button>
        <button class="btn ghost" id="next" style="margin-left:auto">Skip →</button></div>` : ""}
      ${S.phase === "swapped" ? `<div class="row" style="margin-top:14px"><button class="btn" id="next">🔀 Next round: new ${esc(SET.whats)}</button></div>` : ""}</section>`;
  $("#v-real").innerHTML = h;
  const on = (id, f) => { const el = $("#" + id); if (el) el.onclick = f; };
  on("resetScore", () => { if (!confirm("Reset the score to 0–0?")) return; S.me = 0; S.them = 0; S.round = 1; save(); drawPlay(); });
  on("shuf", () => { shuffleReal(); save(); drawPlay(); toast("New real one!"); });
  document.querySelectorAll("[data-use]").forEach(b => b.onclick = () => { S.fake = +b.dataset.use; save(); drawPlay(); });
  on("others", () => { newOffer(); save(); drawPlay(); });
  on("own", () => { S.fake = "own"; save(); drawPlay(); $("#ownName").focus(); });
  const bind = (id, get, set) => { const el = $("#" + id); if (el){ el.value = get(); el.oninput = () => { set(el.value); save(); $("#go").disabled = !lie(); }; } };
  bind("ownName", () => S.own.name, v => S.own.name = v);
  bind("ownStory", () => S.own.story, v => S.own.story = v);
  bind("extra", () => S.extra, v => S.extra = v);
  on("go", () => { if (!lie()) return; S.phase = "tell"; save(); drawPlay(); window.scrollTo({top:0}); });
  on("swap", () => { S.first = S.first === "real" ? "fake" : "real"; save(); drawPlay(); });
  on("back", () => { S.phase = "prep"; save(); drawPlay(); });
  const r = $("#reveal"); if (r) holdTo(r, () => { S.phase = "revealed"; save(); drawPlay(); });
  on("fooled", () => { S.me++; S.phase = "scored"; save(); drawPlay(); toast("Point to you!"); });
  on("spotted", () => { S.them++; S.phase = "scored"; save(); drawPlay(); toast("Point to your partner"); });
  on("iSpot", () => { S.me++; S.phase = "swapped"; save(); drawPlay(); toast("Point to you!"); });
  on("iFooled", () => { S.them++; S.phase = "swapped"; save(); drawPlay(); toast("Point to your partner"); });
  on("next", () => { S.round++; newRound(); save(); drawPlay(); window.scrollTo({top:0}); });
}
function holdTo(btn, done){
  let t0 = 0, raf = 0; const bar = btn.querySelector("i");
  const step = () => { const p = Math.min(1, (performance.now() - t0) / 900); bar.style.width = (p*100)+"%"; if (p >= 1){ stop(); done(); } else raf = requestAnimationFrame(step); };
  const start = e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); };
  const stop = () => { cancelAnimationFrame(raf); bar.style.width = "0"; };
  btn.addEventListener("pointerdown", start); ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("keydown", e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); done(); } });
}

/* ---------- teacher: how to run it and all the items ---------- */
function drawKey(){
  $("#v-teacher").innerHTML = `<section class="card how"><h2>How to run it</h2><ol>
      <li>Students play head to head in pairs, each on their own phone.</li>
      <li>Each phone deals a real ${esc(SET.what)} and offers two lies. The player picks one, tells their partner about A and B, the partner guesses, and the player holds to reveal.</li>
      <li>A point for each lie that fools your partner and each lie of theirs you spot. Both turns go on each phone's score.</li></ol></section>
    <section class="card"><h2>All the items</h2><p class="sub">For your screen only.</p>
    <h3 style="margin:10px 0 4px;color:var(--true)">Real</h3><ol class="keylist">${SET.items.map(it=>`<li><b>${esc(it.name)}</b><br><span class="small">${esc(it.fact)}</span></li>`).join("")}</ol>
    <h3 style="margin:14px 0 4px;color:var(--lie)">Made up</h3><ol class="keylist">${FAKES.map(it=>`<li><b>${esc(it.name)}</b><br><span class="small">${esc(it.fact)}</span></li>`).join("")}</ol></section>`;
}
$("#v-real").hidden = TEACHER; $("#v-teacher").hidden = !TEACHER;
$("#who").textContent = TEACHER ? "Teacher's screen" : "";
if (TEACHER) drawKey(); else drawPlay();
});
</script>
